name: Schema Sentinel

on:
  pull_request:
    paths:
      - '*.sql'
      - 'migrations/*.sql'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install and run
        run: |
          pip install -e .
          schema-sentinel analyze test_migration.sql --no-db --format github > report.md || true
      
      - name: Post comment
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('report.md', 'utf8');
            body += '\n\n---\n💡 **Tip:** Run `schema-sentinel profile <table>` to get production stats for more accurate risk scoring.';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Block on high risk
        run: |
          if grep -q "🔴.*HIGH" report.md; then
            echo "❌ High-risk migrations detected!"
            exit 1
          fi